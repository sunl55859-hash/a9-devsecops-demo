name: Lint (Checkstyle + SpotBugs)

on:
  push:
  pull_request:

# 最小權限：這個 workflow 只需要讀取程式碼
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # 風格與常見錯誤；error 等級的違規會讓 build 失敗
      - name: Checkstyle
        run: mvn -B checkstyle:check

      # 安全規則（Find Security Bugs）；有 Medium 以上的發現就失敗
      - name: SpotBugs + Find Security Bugs
        run: mvn -B compile spotbugs:check
