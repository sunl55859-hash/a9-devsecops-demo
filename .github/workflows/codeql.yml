name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # 每週一 03:00 UTC 再掃一次

# 預設全部唯讀；只有 analyze job 另外拿到上傳結果所需的權限
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # 上傳掃描結果到 Security 分頁
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: autobuild
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
